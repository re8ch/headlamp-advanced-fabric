apiVersion: governance.re8ch.com/v1alpha1
kind: ClusterResourceIndex
metadata:
  name: headlamp-advanced-fabric
spec:
  controlPlane:
    repository: git@gitlab.com:reachievellc/service-backend.git
    revision: main
    indexPath: indexes/deployments.json
  lookup:
    module: headlamp-advanced-fabric
    catalog: platform
    declaredDeployments: []
  evidence:
    authority: kubernetes
    requiredPlanes:
    - monitoring
    - deploying
    - planning

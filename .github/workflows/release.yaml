name: Release Headlamp plugin

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run tsc
      - run: npm run build
      - run: npm run package
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" ./*.tar.gz --generate-notes

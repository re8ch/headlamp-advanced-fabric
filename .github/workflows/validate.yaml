name: Validate
on:
  pull_request:
    paths:
      - src/**
      - docs/**
      - package.json
      - package-lock.json
      - .github/workflows/validate.yaml
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run tsc
      - run: npm run build
      - run: npm run package
